# ~/.config/hypr/hyperland.conf

general {
    border_size = 1
    no_border_on_floating = false

    gaps_in = 3
    gaps_out = 5
    gaps_workspaces = 0

    col.inactive_border = 0xff444444
    col.active_border = 0xffffffff
    col.nogroup_border = 0xffff00ff
    
    layout = dwindle

    no_focus_fallback = true
    
    resize_on_border = true
    extend_border_grab_area = 5
    hover_icon_on_border = true

    allow_tearing = false

    resize_corner = 0

    snap {
        enabled = false
        window_gap = 10
        monitor_gap = 10
        border_overlap = false
    }
}

decoration {
    rounding = 0
    # rounding_power = 4.0

    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0
    dim_inactive = false
    dim_strength = 0.5
    dim_special = 0.2
    dim_around = 0.4

    blur {
        enabled = true

        size = 8
        passes = 1
        noise = 0.01
        contrast = 0.8
        brightness = 0.8
        vibrancy = 0.0
        vibrancy_darkness = 0.0

        ignore_opacity = true
        new_optimizations = true
        xray = true
        special = false
        popups = false
        # input_methods = false
    }

    shadow {
        enabled = false

        range = 4
        render_power = 3
        sharp = false
        
        ignore_window = true

        color = 0xee1a1a1a
        color_inactive = 0xee1a1a1a
        # offset = [0,0]
        scale = 1.0
    }
}

animations {
    enabled = false
    first_launch_animation = true
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_min_fingers = false
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.2
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10

    workspace_swipe_touch = false
    workspace_swipe_touch_invert = false

    workspace_swipe_create_new = false

    workspace_swipe_forever = true

    workspace_swipe_use_r = false
}

group {
    auto_group = true
    insert_after_current = true
    focus_removed_window = true
    drag_into_group = 1
    merge_groups_on_drag = true
    merge_groups_on_groupbar = true
    merge_floated_into_tiled_on_groupbar = false
    group_on_movetoworkspace = false

    col.border_active = 0x66ffff00
    col.border_inactive = 0x66777700
    col.border_locked_active = 0x66ff5500
    col.border_locked_inactive = 0x66775500

    groupbar {
        enabled = true
        font_family = misc:font_family
        font_size = 8
        gradients = true
        height = 14
        stacked = false
        priority = 3
        render_titles = false
        scrolling = true

        text_color = 0xffffffff
        
        col.active = 0x66ffff00
        col.inactive = 0x66777700
        col.locked_active = 0x66ff5500
        col.locked_inactive = 0x66775500
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    
    col.splash = 0xffffffff
    
    font_family = Letter
    # splash_font_family = 
    force_default_wallpaper = -1
    vfr = true
    vrr = 1
    mouse_move_enables_dpms = false
    key_press_enables_dpms = true
    always_follow_on_dnd = true
    layers_hog_keyboard_focus = true
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    disable_autoreload = true
    enable_swallow = false
    # swallow_regex = 
    # swallow_exception_regex = 
    focus_on_activate = true
    mouse_move_focuses_monitor = true
    render_ahead_of_time = false
    render_ahead_safezone = 1
    allow_session_lock_restore = false
    background_color = 0x018281
    close_special_on_empty = true
    new_window_takes_over_fullscreen = 2
    exit_window_retains_fullscreen = false
    initial_workspace_tracking = 1
    middle_click_paste = false
    render_unfocused_fps = 12
    disable_xdg_env_checks = false
    # disable_hyprland_qtutils_check = false
    # lockdead_screen_delay = 1000
}

binds {
    pass_mouse_when_bound = false
    scroll_event_delay = 300
    workspace_back_and_forth = false
    allow_workspace_cycles = false
    workspace_center_on = 1
    focus_preferred_method = 0
    ignore_group_lock = false
    # movefocus_cycles_fullscreen = true
    # movefocus_cycles_groupfirst = false
    disable_keybind_grabbing = false
    window_direction_monitor_fallback = true
    # allow_pin_fullscreen = true
}

xwayland {
    enabled = true
    use_nearest_neighbor = true
    force_zero_scaling = false
}

opengl {
    nvidia_anti_flicker = false
    force_introspection = 2
}

render {
    explicit_sync = 2
    explicit_sync_kms = 2
    direct_scanout = false
    expand_undersized_textures = true
    # xp_mode = false
    # ctm_animation = 2
    # allow_early_buffer_release = true
}

cursor {
    sync_gsettings_theme = true
    no_hardware_cursors = false
    no_break_fs_vrr = false
    min_refresh_rate = 24
    hotspot_padding = 1
    inactive_timeout = 10
    no_warps = false
    persistent_warps = false
    warp_on_change_workspace = 0
    # default_monitor = 
    zoom_factor = 1.0
    zoom_rigid = false
    # enable_hypercursor = false
    hide_on_key_press = true
    hide_on_touch = true
    # use_cpu_buffer = 2
    # warp_back_after_non_mouse_input = false
}

ecosystem {
    # no_update_news = false
    # no_donation_nag = true
}

exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = dunst --verbosity crit
exec-once = waycorner
exec-once = waybar

# TODO Replace with something else?
exec-once = wlsunset -t 2500 -l 50.51 -L 4.21

exec-once = nextcloud --background

# Turn volume off at boot
exec-once = pactl set-sink-mute @DEFAULT_SINK@ 1

# STYLING
exec-once = swaybg -i "${HOME}/.local/state/sisyphus/bg" --mode=fill
env = XCURSOR_SIZE,24

# SHIFT CAPS CTRL/CONTROL ALT MOD2 MOD3 SUPER/WIN/LOGO/MOD4 MOD5
$flag = MOD4

$left  = h
$down  = j
$up    = k
$right = l

$term = foot
$menu = j4-dmenu-desktop --dmenu="rofi -dmenu -i" --no-generic --usage-log="/home/tdpeuter/.local/state/dmenu.log" --term=$term
$lock = swaylock

source = /home/tdpeuter/.config/hypr/input-output.conf
source = /home/tdpeuter/.config/hypr/keybinds.conf
source = /home/tdpeuter/.config/hypr/modes.conf

# https://wiki.hyprland.org/Nvidia/#environment-variables
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = NVD_BACKEND,direct
